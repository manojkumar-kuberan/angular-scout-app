<section class="contact-channels" aria-label="Other ways to contact us">
  <!-- Email -->
  <article class="contact-channel">
    <div class="channel-icon" aria-hidden="true">
      <i class="pi pi-envelope"></i>
    </div>

    <div class="channel-content">
      <h2>Email</h2>
      <p>Get a response within 24 hours</p>
      <a href="mailto:hello@company.com">hello@company.com</a>
    </div>
  </article>

  <!-- Live Chat -->
  <article class="contact-channel">
    <div class="channel-icon" aria-hidden="true">
      <i class="pi pi-comments"></i>
    </div>

    <div class="channel-content">
      <h2>Live Chat</h2>
      <p>Instant support available now</p>
      <a
        href="https://www.shadcnblocks.com/preview/contact6?iframe=true&live=1#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Start chatting
      </a>
    </div>
  </article>

  <!-- Phone -->
  <article class="contact-channel">
    <div class="channel-icon" aria-hidden="true">
      <i class="pi pi-phone"></i>
    </div>

    <div class="channel-content">
      <h2>Phone</h2>
      <p>Mon-Fri, 9AM-6PM EST</p>
      <a href="tel:+15551234567">+1 (555) 123-4567</a>
    </div>
  </article>

  <!-- Office -->
  <article class="contact-channel">
    <div class="channel-icon" aria-hidden="true">
      <i class="pi pi-map-marker"></i>
    </div>

    <div class="channel-content">
      <h2>Office</h2>
      <p>Schedule an in-person meeting</p>
      <a
        href="https://www.shadcnblocks.com/preview/contact6?iframe=true&live=1#"
        target="_blank"
        rel="noopener noreferrer"
      >
        123 Innovation St, Tech City
      </a>
    </div>
  </article>
</section>
